<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Morgenster Inventory</title>
    <!-- Core UI CSS assets -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .login-card {
            border: none;
            border-top: 4px solid #0d6efd;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Centering wrapper -->
    <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-12 col-md-6 col-lg-4">
            
            <div class="card p-4 p-md-5 shadow-sm login-card bg-white">
                
                <!-- Branding Header -->
                <div class="text-center mb-4">
                    <div class="d-inline-flex p-3 bg-primary bg-opacity-10 rounded-circle text-primary mb-3">
                        <i class="bi bi-shield-lock-fill fs-3"></i>
                    </div>
                    <h2 class="h4 fw-bold text-dark mb-1">Morgenster Inventory</h2>
                    <p class="text-muted small">Sign in to manage warehouse registries</p>
                </div>

                <!-- Dynamic Flash Alert Loop -->
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert {% if message.tags %}alert-{{ message.tags }}{% else %}alert-danger{% endif %} d-flex align-items-center small py-2.5" role="alert">
                            <i class="bi bi-exclamation-circle-fill me-2"></i>
                            <div>{{ message }}</div>
                        </div>
                    {% endfor %}
                {% endif %}

                <!-- Credential Capture Form -->
                <form method="POST">
                    {% csrf_token %}

                    <!-- Username Field -->
                    <div class="mb-3">
                        <label for="id_username" class="form-label text-secondary fw-medium small">Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-person"></i></span>
                            <input type="text" 
                                   name="username" 
                                   id="id_username"
                                   class="form-control border-start-0 ps-0" 
                                   placeholder="Enter username"
                                   required 
                                   autofocus>
                        </div>
                    </div>

                    <!-- Password Field -->
                    <div class="mb-4">
                        <label for="id_password" class="form-label text-secondary fw-medium small">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-key"></i></span>
                            <input type="password" 
                                   name="password" 
                                   id="id_password"
                                   class="form-control border-start-0 ps-0" 
                                   placeholder="Enter password"
                                   required>
                        </div>
                    </div>

                    <!-- Auth Submission Action -->
                    <button type="submit" class="btn btn-primary w-100 fw-medium shadow-sm py-2">
                        Sign In <i class="bi bi-arrow-right-short ms-1"></i>
                    </button>
                    
                </form>

            </div>
            
            <!-- Footer Attribution -->
            <p class="text-center text-muted x-small mt-4" style="font-size: 0.8rem;">
                &copy; 2026 Morgenster System Admin &bull; Secure Pipeline
            </p>
            
        </div>
    </div>
</div>

</body>
</html>
